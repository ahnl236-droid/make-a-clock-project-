<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>JS clock</title>


	<style>
		body {
			min-height: 100vh;
			margin: 0;

			display: flex;
			justify-content: center;
			align-items: center;

			background-color: rgb(238, 245, 254);
			transition: 1s;
		}

		.night {
    	background-color: #171c32;
		}

		#nightButton {
			position: fixed;
			top: 30px;
			right: 30px;

			padding: 10px 18px;
			border: none;
			border-radius: 20px;
			color: rgb(0, 0, 0);
			font-family: monospace;

			cursor: pointer;
		}


		.clock-container {
			display: flex;
			flex-direction: column;
			align-items: center;

			gap: 20px;

		}

		@keyframes rotateClocks {
			from {
				transform: rotate(0deg);
			}

			to{
				transform: rotate(360deg);
			}
		}

		.secondsClock {
			width: 250px;
			height: 250px;
			border-radius: 50%;
			background: linear-gradient(hsl(202, 98%, 76%) 50%, #fff87c 50%);
			
			display: flex;
			justify-content: center;
			align-items: center;

			
		}

 		.minutesClock {
			width: 250px;
			height: 250px;
			border-radius: 50%;
			background: linear-gradient(hsl(36, 100%, 73%) 50%, #a1fc8b 50%);
			
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.hoursClock {
			width: 250px;
			height: 250px;
			border-radius: 50%;
			background: linear-gradient(hsl(0, 98%, 74%) 50%, #ae8bff 50%);
			
			display: flex;
			justify-content: center;
			align-items: center;
		}

	</style>


</head>

<body>

	<button id="nightButton">Lights Out!</button>

	<div class="clock-container">

		<div class="secondsClock"></div>
		<div class="minutesClock"></div>
		<div class="hoursClock"></div>
	</div>


	<script>

/* ze clock elements */

const secondsClock = document.querySelector(".secondsClock");
const minutesClock = document.querySelector(".minutesClock");
const hoursClock = document.querySelector(".hoursClock");

/* ze functions */

  function secondTick() {
    const seconds = new Date().getSeconds();
    secondsClock.style.transform = `rotate(${seconds * 6}deg)`;
  }

  function hourTick() {
    const hours = new Date().getHours(); 
    hoursClock.style.transform = `rotate(${hours * 15}deg)`;
  }

  function minuteTick() {
    const minutes = new Date().getMinutes(); 
    minutesClock.style.transform = `rotate(${minutes * 6}deg)`;
  }

/* ze initialization */

function updateClock() {
  secondTick();
  minuteTick();
  hourTick();
}

updateClock();

setInterval(updateClock, 1000);

const nightButton = document.querySelector("#nightButton");

nightButton.onclick = () => {

    document.body.classList.toggle("night");

    nightButton.textContent = document.body.classList.contains("night")
        ? "Lights On!"
        : "Lights Out!";

};
	</script>

</body>

</html>
